[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "researchmind"
version = "0.1.0"
description = "Multi-agent research paper analysis platform"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.0",
    "groq>=0.11.0",
    "sentence-transformers>=3.0.0",
    "pypdf>=4.0.0",
    "chromadb>=0.5.0",
    "pydantic>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]