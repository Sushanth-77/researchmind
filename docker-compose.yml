services:
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      # Overrides .env's localhost value: inside Docker's network, Neo4j
      # is reachable at its service name, not localhost.
      NEO4J_URI: bolt://neo4j:7687
    ports:
      - "8001:8000"
    volumes:
      # Bind-mounted (not named volumes) so the containerized backend
      # reuses your existing local Chroma data and ingested PDFs, rather
      # than starting from an empty store.
      - ./scripts:/app/scripts
      - ./chroma_db:/app/chroma_db
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      neo4j:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      API_BASE_URL: http://backend:8000
      API_KEY: ${API_KEY}
    ports:
      - "8501:8501"
    depends_on:
      - backend

volumes:
  neo4j_data: